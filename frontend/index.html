<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>turnstile-appcheck-gateway Admin</title>
    <link rel="icon" type="image/svg+xml" href="./turnstile-appcheck-gateway-logo.svg" />
    <script>
      (() => {
        try {
          const key = 'turnstile-appcheck-gateway.theme';
          const value = localStorage.getItem(key) || 'system';
          const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
          const dark = value === 'dark' || (value === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
